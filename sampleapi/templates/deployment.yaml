apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "helmchart.fullname" . }}
  labels:
    app: {{ include "helmchart.fullname" . }}
    chart: {{ include "helmchart.chart" . }}   
    release: {{ .Release.Name }}    
    version: v1
spec:  
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "helmchart.fullname" . }}
      version: v1 
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ include "helmchart.fullname" . }}
        version: v1
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:      
      volumes:
        - name: environment
          secret:
            secretName: environment-settings 
      automountServiceAccountToken: false      
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        runAsNonRoot: true
      containers:
      - name: {{ include "helmchart.fullname" . }}
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: Always
        env:
        - name: APPINSIGHTS_INSTRUMENTATIONKEY
          valueFrom:
            secretKeyRef:
              name: environment-secrets-proc
              key: APPINSIGHTS_INSTRUMENTATIONKEY
        - name: RedisConnectionCount
          valueFrom:
            secretKeyRef:
              name: sampleapi-config-secret
              key: RedisConnectionCount
        - name: RedisConnectionString
          valueFrom:
            secretKeyRef:
              name: sampleapi-config-secret
              key: RedisConnectionString
        ports:
        - containerPort: 5000
        volumeMounts:
          - name: environment
            mountPath: "/environment"
            readOnly: true
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        securityContext:
          capabilities:
            drop:
              - ALL
          privileged: false            
          allowPrivilegeEscalation: false    
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "helmchart.fullname" . }}-int
  labels:
    app: {{ include "helmchart.fullname" . }}-int
    chart: {{ include "helmchart.chart" . }}   
    release: {{ .Release.Name }}    
    version: v1
spec:  
  replicas: {{ .Values.replicaCount }}
  selector:

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: {{ include "helmchart.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  host: {{ include "helmchart.fullname" . }}
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 4
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 1s
      baseEjectionTime: 3m
      maxEjectionPercent: 100
    tls:
      mode: DISABLE
  subsets:
  - name: v1
    labels:
      version: v1
---
{{- if .Values.testgateway.enabled -}}
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: {{ include "helmchart.fullname" . }}-int
  namespace: {{ .Release.Namespace }}
spec:
  host: {{ include "helmchart.fullname" . }}-int
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    outlierDetection:
      baseEjectionTime: 3m
      consecutive5xxErrors: 30
      interval: 1m
      maxEjectionPercent: 100
    tls:
      mode: DISABLE
  subsets:
  - name: v1
    labels:
      version: v1
{{- end }}
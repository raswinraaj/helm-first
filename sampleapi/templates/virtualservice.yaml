apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "helmchart.fullname" . }}-route
spec:
  hosts:
  - {{ .Values.ingressDomain }}
  gateways:
  - {{ .Release.Namespace }}/{{ .Values.gateway }}
  http:
  - match:
    - uri:
        prefix: /sampleapi    
    rewrite:
      uri: /swagger
    route:
    - destination:
        host: sampleapi
        port:
          number: 9010
        subset: v1
  - match:
    - headers:
        referer:
          regex: .*/sampleapi/.*
      uri: 
        prefix: /swagger
    route:
    - destination:
        host: sampleapi
        port:
          number: 9010 
        subset: v1
  - name: "sampleapi-triggerroute"
    match:
    - uri:
        prefix: /v1/doverfs.com/controlgroups/
      ignoreUriCase: true
    route:
    - destination:
        host: sampleapi
        port:
          number: 9010
        subset: v1
    timeout: 180s
    retries:
      attempts: 3
      retryOn: gateway-error,connect-failure,refused-stream
    corsPolicy:
      allowOrigin:
      - "*"
      allowMethods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - authorization
      - content-type
      - etag
---
{{- if .Values.testgateway.enabled -}}
